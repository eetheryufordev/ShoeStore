<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trang quản trị cửa hàng Shoe Store" />
    <title>Shoe Store - Quản trị hệ thống</title>
    
    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <!-- Tailwind CSS -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              montserrat: ['Montserrat', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Style -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="min-h-screen bg-[#f8f9fa] font-montserrat text-[#212529] antialiased">
    <div id="app" class="min-h-screen">
      <!-- Loading placeholder -->
      <div class="min-h-screen grid place-items-center bg-[#f8f9fa]">
        <div class="text-center space-y-3">
          <div class="inline-block w-8 h-8 border-4 border-zinc-900 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-sm font-semibold text-zinc-500">Đang khởi động hệ thống quản trị...</p>
        </div>
      </div>
    </div>
    
    <script type="module" src="./app.js"></script>
  </body>
</html>
